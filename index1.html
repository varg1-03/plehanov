<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>А.Линник</title>
  </head>
  <style>
    a {
      text-decoration: none;
    }
    header {
      display: flex;
      background-color: #4c17eb;
      justify-content: flex-start;
      align-items: center;
      gap: 20px;
    }
    .nav-list {
      justify-content: center;
      margin: 0px;
      list-style: none;
      width: 100%;
    }
    .nav-list a {
      color: #fffffc;
      width: 100%;
      height: 100%;
    }
    li {
      display: inline;
    }
    h1 {
      display: inline;
      color: #fffffc;
      padding-left: 20px;
    }
  </style>
  <body>
    <header>
      <h1>ЛИННИК</h1>
      <nav>
        <ul class="nav-list">
          <li><a href="">Биография</a></li>
          <li><a href="">Проекты</a></li>
          <li><a href="">Образ Будущего</a></li>
          <li><a href="">Партнёры</a></li>
          <li><a href="">Отзывы</a></li>
        </ul>
      </nav>
      <button>НАПИСАТЬ</button>
    </header>
  </body>
</html>
